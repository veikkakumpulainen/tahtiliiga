[functions.stripe-webhook]
verify_jwt = false

[functions.notify-group-message]
verify_jwt = false

[functions.notify-community-message]
verify_jwt = false

[functions.notify-qualification-message]
verify_jwt = false

[functions.notify-direct-message]
verify_jwt = false

[functions.notify-round-started]
verify_jwt = false

[functions.notify-round-reminder]
verify_jwt = false

[auth]
additional_redirect_urls = []
site_url = "http://localhost:3000"

[auth.email]
enable_confirmations = false
max_frequency = "1m0s"
otp_length = 8

[auth.email.smtp]
enabled = true
host = "smtp.ethereal.email"
port = 587
user = "env(ETHEREAL_SMTP_USER)"
pass = "env(ETHEREAL_SMTP_PASS)"
admin_email = "dev@tahtiliiga.local"
sender_name = "Tähtiliiga (dev)"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[db.pooler]
default_pool_size = 15
max_client_conn = 200

[storage.analytics]
enabled = true
max_namespaces = 10

[storage.image_transformation]
enabled = true
